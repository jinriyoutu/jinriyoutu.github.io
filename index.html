<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今日有图艺术研究 TP STUDIO｜全国高校艺术类招聘资讯</title>
    <link rel="canonical" href="https://jinriyoutu.com/" />
    <meta property="og:url" content="https://jinriyoutu.com/" />
    <meta property="og:title" content="今日有图艺术研究 TP STUDIO｜全国高校艺术类招聘资讯" />
    <link rel="stylesheet" href="styles.css?v=20260603-1" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">
          <span>今日有图艺术研究</span>
          <span lang="en">TP STUDIO</span>
        </p>
        <h1>全国高校艺术类招聘资讯</h1>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="检索和筛选">
        <label class="search-field">
          <span>关键词</span>
          <input id="keyword" type="search" placeholder="学校 / 岗位 / 学科 / 城市" autocomplete="off" />
        </label>

        <label>
          <span>省份</span>
          <select id="province"></select>
        </label>

        <label>
          <span>学校层次</span>
          <select id="level"></select>
        </label>

        <label>
          <span>岗位方向</span>
          <select id="discipline"></select>
        </label>

        <label>
          <span>状态</span>
          <select id="status"></select>
        </label>

        <button id="resetFilters" type="button">清空</button>
      </section>

      <section class="stats" aria-label="数据概览">
        <div>
          <strong id="shownCount">0</strong>
          <span>匹配结果</span>
        </div>
        <div>
          <strong id="activeCount">0</strong>
          <span>报名中</span>
        </div>
        <div>
          <strong id="urgentCount">0</strong>
          <span>7 天内截止</span>
        </div>
        <div>
          <strong id="schoolCount">0</strong>
          <span>覆盖学校</span>
        </div>
      </section>

      <section id="jobs" class="section">
        <div class="section-head">
          <div>
            <h2>岗位列表</h2>
          </div>
        </div>

        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th>学校</th>
                <th>地区</th>
                <th>层次</th>
                <th>岗位</th>
                <th>方向</th>
                <th>类型</th>
                <th>发布日期</th>
                <th>截止</th>
                <th>状态</th>
                <th>来源</th>
              </tr>
            </thead>
            <tbody id="jobRows"></tbody>
          </table>
          <p id="emptyJobs" class="empty" hidden>没有匹配的信息。</p>
        </div>
        <div id="pagination" class="pagination" aria-label="分页">
          <button id="prevPage" type="button">上一页</button>
          <span id="pageInfo">第 1 / 1 页</span>
          <button id="nextPage" type="button">下一页</button>
          <span id="pageRange">本页 0 条</span>
        </div>
      </section>

    </main>

    <footer>
      <p>所有详情以学校官网、招聘系统或政府部门原文为准。</p>
    </footer>

    <script src="data/jobs.js?v=20260603-1"></script>
    <script src="app.js?v=20260603-1"></script>
  </body>
</html>
